[package]
name = "pairflow-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Keyboard and mouse capture and injection for Pairflow"
rust-version.workspace = true

[dependencies]
pairflow-proto.workspace = true
pairflow-core.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput", "xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
foreign-types = "0.5"
