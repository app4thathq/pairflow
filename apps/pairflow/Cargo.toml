[package]
name = "pairflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Share a keyboard and mouse across computers with a 5-character code"
rust-version.workspace = true

[lib]
name = "pairflow"
path = "src/lib.rs"

[[bin]]
name = "pairflow"
path = "src/main.rs"

[[bin]]
name = "pairflow-gui"
path = "src/bin/pairflow-gui.rs"

[dependencies]
pairflow-proto.workspace = true
pairflow-core.workspace = true
pairflow-input.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
ksni = "0.2"
